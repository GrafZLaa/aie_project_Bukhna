name: tests

on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    defaults:
      run:
        working-directory: project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract OCR + OpenCV runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-rus \
            tesseract-ocr-eng \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'project/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          ENABLE_LLM: '0'
        run: pytest tests -v --tb=short
